<svg viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Feed Filter</title>
  <!-- Chrome Web Store: 96x96 artwork, 16px transparent padding per side.
       Faint white outer glow keeps the dark tile visible on dark backgrounds. -->
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feMorphology in="SourceAlpha" operator="dilate" radius="1" result="grown"/>
      <feGaussianBlur in="grown" stdDeviation="2" result="blur"/>
      <feFlood flood-color="#FFFFFF" flood-opacity=".22"/>
      <feComposite in2="blur" operator="in" result="halo"/>
      <feMerge><feMergeNode in="halo"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g transform="translate(16 16) scale(.75)" filter="url(#glow)">
    <rect width="128" height="128" rx="37" fill="#16150F"/>
    <rect x="32" y="34" width="64" height="13" rx="6.5" fill="#C9F25D"/>
    <rect x="32" y="57.5" width="64" height="13" rx="6.5" fill="#F3F0E8" opacity=".28"/>
    <rect x="32" y="81" width="43" height="13" rx="6.5" fill="#C9F25D"/>
  </g>
</svg>
