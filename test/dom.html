<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../content.css">
<style>
  body { margin:0; font-family: system-ui; background:#0f0f0f; color:#eee; }
  #tiles { display:flex; flex-wrap:wrap; }
  ytd-rich-item-renderer { display:block; width:320px; height:210px; margin:12px; background:#181818; }
  /* high-contrast stripes so a blur is visually obvious in screenshots */
  .thumb { display:block; width:320px; height:150px;
           background: repeating-linear-gradient(45deg,#0a2540 0 7px,#cfe3ff 7px 14px); }
  h3 { margin:6px 8px 2px; font-size:14px; }
  a { color:#8cf; text-decoration:none; }
  ytd-channel-name { display:block; margin:0 8px; font-size:12px; color:#aaa; }
  #results { background:#000; padding:12px; margin:0; font:13px ui-monospace,monospace; white-space:pre; }
</style>
<script>
  const SETTINGS = {
    enabled: true, provider: "openrouter", apiKey: "x", model: "jev-latest",
    goals: "systems programming", onboarded: true,
    surfaces: { home:true, search:true, sidebar:true, shorts:true },
    baitThreshold: 2.0, offGoalThreshold: 2.6, junkThreshold: 0.85,
    minConfidence: 0.5, hideUntilChecked: false, blurStrength: 80, fallbackHeuristics: true,
  };
  const VERDICTS = {
    aaaaaaaaaaa: { tag:"CLICK-BAIT", why:"bait 2.9/3 · 97% conf", scores:{}, source:"t" },
    bbbbbbbbbbb: { tag:null, why:"", scores:{}, source:"t" },
    ccccccccccc: { tag:"SPAM", why:"spam 95%", scores:{}, source:"t" },
  };
  window.chrome = {
    runtime: {
      id: "test-extension-id",
      lastError: null,
      sendMessage(msg, cb) {
        if (!cb) return;
        if (msg.type === "settings") return void setTimeout(() => cb(SETTINGS), 0);
        if (msg.type === "judge") {
          const verdicts = {};
          for (const v of msg.videos) verdicts[v.id] = VERDICTS[v.id] || { tag:null, why:"", scores:{} };
          return void setTimeout(() => cb({ verdicts, settings: SETTINGS }), 0);
        }
        setTimeout(() => cb({}), 0);
      },
      onMessage: { addListener() {} },
    },
    storage: {
      local: {
        set(patch) {
          if (patch.settings) Object.assign(SETTINGS, patch.settings);
          return Promise.resolve();
        },
      },
      onChanged: {
        _listeners: [],
        addListener(fn) { this._listeners.push(fn); },
      },
    },
  };

  // Simulates what the real popup does: writes storage, which fires onChanged
  // in every other extension context (background, content scripts).
  window.__setEnabled = (v) => {
    chrome.storage.local.set({ settings: { ...SETTINGS, enabled: v } });
    for (const fn of chrome.storage.onChanged._listeners) fn({ settings: {} }, "local");
  };

  // Simulates the extension being reloaded/updated while this tab is still open:
  // chrome.runtime.id disappears and touching chrome.runtime.lastError throws
  // synchronously, exactly like real post-invalidation Chrome.
  window.__invalidate = () => {
    Object.defineProperty(chrome.runtime, "id", { configurable: true, get() { return undefined; } });
    Object.defineProperty(chrome.runtime, "lastError", {
      configurable: true,
      get() { throw new Error("Extension context invalidated."); },
    });
  };
</script>
</head>
<body>
<div id="tiles">
  <ytd-rich-item-renderer id="tileA">
    <a id="thumbnail" href="/watch?v=aaaaaaaaaaa"><span class="thumb"></span></a>
    <h3><a id="video-title-link" href="/watch?v=aaaaaaaaaaa"><span id="video-title">You WON'T BELIEVE this</span></a></h3>
    <ytd-channel-name><a href="#">DramaDaily</a></ytd-channel-name>
  </ytd-rich-item-renderer>
  <ytd-rich-item-renderer id="tileB">
    <a id="thumbnail" href="/watch?v=bbbbbbbbbbb"><span class="thumb"></span></a>
    <h3><a id="video-title-link" href="/watch?v=bbbbbbbbbbb"><span id="video-title">Rust ownership explained</span></a></h3>
    <ytd-channel-name><a href="#">Systems Weekly</a></ytd-channel-name>
  </ytd-rich-item-renderer>
  <ytd-rich-item-renderer id="tileC">
    <a id="thumbnail" href="/watch?v=ccccccccccc"><span class="thumb"></span></a>
    <h3><a id="video-title-link" href="/watch?v=ccccccccccc"><span id="video-title">FREE crypto airdrop bot</span></a></h3>
    <ytd-channel-name><a href="#">Wealth Signals</a></ytd-channel-name>
  </ytd-rich-item-renderer>
</div>
<pre id="results">running…</pre>

<script src="../content.js"></script>
<script>
// Record navigation attempts instead of following them.
window.__navigated = null;
document.addEventListener("click", (e) => {
  const a = e.target.closest && e.target.closest("a[href^='/watch']");
  if (a) { window.__navigated = a.getAttribute("href"); e.preventDefault(); }
}, false);

const log = []; let fails = 0;
const ok = (c, m) => { log.push((c ? "  PASS  " : "  FAIL  ") + m); if (!c) fails++; };
const css = (el, p) => getComputedStyle(el).getPropertyValue(p);

window.__ready = (async () => {
  await new Promise(r => setTimeout(r, 1200));
  const A = document.querySelector("#tileA"), B = document.querySelector("#tileB"), C = document.querySelector("#tileC");

  ok(!!A.querySelector(".ygf-veil"), "flagged tile gets a veil");
  ok(!!C.querySelector(".ygf-veil"), "spam tile gets a veil too");
  ok(!B.querySelector(".ygf-veil"), "allowed tile is left alone");
  ok(!B.classList.contains("ygf-host"), "allowed tile is not even marked");
  ok(!A.querySelector(".ygf-chip"), "no chip/badge is rendered on the veil");

  const veil = A.querySelector(".ygf-veil");
  const bf = css(veil, "backdrop-filter") || css(veil, "-webkit-backdrop-filter");
  ok(bf.includes("blur(16px)"), "80% strength renders as blur(16px) — got " + bf);
  ok(css(veil, "opacity") === "1", "veil is opaque before hover");

  document.getElementById("results").textContent = log.join("\n");
  return fails;
})();

window.__report = (extra) => {
  const all = log.concat(extra || []);
  const passed = all.filter(l => l.startsWith("  PASS")).length;
  const failed = all.filter(l => l.startsWith("  FAIL")).length;
  document.getElementById("results").textContent = all.join("\n") + "\n\n" +
    (failed ? failed + " of " + (passed + failed) + " FAILED" : "all " + passed + " checks passed");
  return failed;
};
window.__fail = (m) => { ok(false, m); };
window.__ok = (c, m) => { ok(c, m); };
</script>
</body></html>
